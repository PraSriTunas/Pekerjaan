<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pekerjaan - Bahasa Melayu Prasekolah (DBP)</title>
  <style>
    :root {
      --bg-sky: #e0f7fa;
      --primary-teal: #4ecdc4;
      --primary-coral: #ff6b6b;
      --accent-yellow: #ffe66d;
      --accent-purple: #9b59b6;
      --accent-blue: #4d96ff;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --correct-green: #2ecc71;
      --wrong-red: #e74c3c;
      --suku-red: #e74c3c;
      --suku-black: #1e293b;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --font-kaiti: "Kaiti SC", "STKaiti", "楷体", "KaiTi", "Comic Sans MS", Arial, sans-serif;
      --font-family: var(--font-kaiti);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-sky);
      background-image: radial-gradient(#b2ebf2 15%, transparent 16%), radial-gradient(#b2ebf2 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
      overflow-x: hidden;
    }

    /* Main Container */
    #app-container {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      border: 4px solid #ffffff;
      box-shadow: 0 15px 35px var(--shadow-color);
      padding: 20px;
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 12px var(--shadow-color);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .student-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f0f9ff;
      padding: 6px 16px;
      border-radius: 30px;
      border: 2px solid var(--accent-blue);
      font-weight: bold;
      color: #0284c7;
      font-size: 1.1rem;
    }

    .btn-small {
      background: var(--accent-yellow);
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      color: #d97706;
      box-shadow: 0 3px 0 #f59e0b;
      transition: all 0.1s ease;
      font-size: 0.9rem;
    }

    .btn-small:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .btn-nav-home {
      background: var(--primary-coral);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #d93838;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
    }

    .btn-nav-home:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    /* Views */
    .view-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex-grow: 1;
      animation: fadeIn 0.3s ease-in-out;
    }

    .view-screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Toast Notification */
    #toast-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 9999;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      max-width: 90%;
    }

    #toast-msg.show {
      transform: translateX(-50%) translateY(0);
    }

    #toast-msg.warning { background: #f39c12; }
    #toast-msg.success { background: #2ecc71; }
    #toast-msg.error { background: #e74c3c; }

    /* START MENU */
    .menu-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-title-ms {
      font-size: 3.2rem;
      font-weight: bold;
      color: var(--primary-coral);
      text-shadow: 3px 3px 0px #ffe66d, 5px 5px 0px rgba(0,0,0,0.1);
      letter-spacing: 2px;
    }

    .app-title-zh {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-blue);
      margin-top: -5px;
    }

    .app-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 10px;
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .name-input-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      border: 3px dashed var(--primary-teal);
      text-align: center;
      margin-bottom: 25px;
    }

    .name-input-label {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .name-input-box {
      width: 100%;
      padding: 14px;
      font-size: 1.4rem;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      text-align: center;
      font-weight: bold;
      outline: none;
      transition: all 0.2s;
      color: var(--accent-purple);
    }

    .name-input-box:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(77, 150, 255, 0.2);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 650px;
    }

    .menu-btn {
      background: white;
      border: none;
      padding: 20px 15px;
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.1);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .menu-btn:hover {
      transform: translateY(-4px);
    }

    .menu-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.1) !important;
    }

    .menu-btn-1 { background: #e0f2fe; border: 3px solid #38bdf8; box-shadow: 0 8px 0 #0284c7; }
    .menu-btn-2 { background: #dcfce7; border: 3px solid #4ade80; box-shadow: 0 8px 0 #16a34a; }
    .menu-btn-3 { background: #fef3c7; border: 3px solid #facc15; box-shadow: 0 8px 0 #ca8a04; }
    .menu-btn-4 { background: #f3e8ff; border: 3px solid #c084fc; box-shadow: 0 8px 0 #9333ea; }

    .menu-btn-icon { font-size: 2.5rem; }

    .menu-btn-title-ms {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .menu-btn-title-zh {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Module Titles */
    .module-title-container {
      text-align: center;
      margin-bottom: 15px;
    }

    .module-title-ms {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-blue);
    }

    .module-title-zh {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* Suku Kata Styling Standards */
    .suku-red {
      color: var(--suku-red);
      font-weight: bold;
    }

    .suku-black {
      color: var(--suku-black);
      font-weight: bold;
    }

    /* Module 1: Flashcards */
    .m1-card {
      background: white;
      border-radius: 28px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border: 4px solid #f1f5f9;
      position: relative;
    }

    .m1-image-box {
      width: 220px;
      height: 220px;
      background: #f8fafc;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px dashed #cbd5e1;
      padding: 10px;
      overflow: hidden;
    }

    .vocab-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    /* Line 1: Syllable arrangements (Red/Black) */
    .word-suku-line {
      font-size: 3.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1.1;
      text-align: center;
    }

    /* Line 2: Full complete word */
    .word-full-line {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--text-main);
      margin-top: -4px;
      text-align: center;
    }

    .word-zh-sub {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: bold;
      background: #f1f5f9;
      padding: 4px 14px;
      border-radius: 12px;
    }

    .audio-controls {
      display: flex;
      gap: 12px;
      margin-top: 5px;
    }

    .btn-audio {
      background: var(--accent-yellow);
      border: none;
      padding: 10px 18px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: bold;
      color: #b45309;
      cursor: pointer;
      box-shadow: 0 4px 0 #d97706;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-audio:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #d97706;
    }

    .btn-audio-slow {
      background: #e0e7ff;
      color: #3730a3;
      box-shadow: 0 4px 0 #4338ca;
    }

    .m1-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-top: 15px;
      gap: 10px;
    }

    .btn-action {
      background: var(--primary-teal);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #0d9488;
      flex: 1;
      text-align: center;
    }

    .btn-action:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0d9488;
    }

    .btn-action:disabled {
      background: #cbd5e1;
      box-shadow: 0 5px 0 #94a3b8;
      cursor: not-allowed;
    }

    .m1-finish-btn {
      background: #2ecc71;
      box-shadow: 0 5px 0 #27ae60;
      width: 100%;
      max-width: 480px;
      margin-top: 12px;
      padding: 14px;
      font-size: 1.2rem;
    }

    /* Module 2: Quiz */
    .quiz-progress {
      font-weight: bold;
      color: var(--accent-purple);
      background: #f3e8ff;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 15px;
      font-size: 1rem;
      text-align: center;
    }

    .quiz-card {
      background: white;
      border-radius: 28px;
      padding: 20px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .quiz-img-box {
      width: 200px;
      height: 200px;
      background: #f8fafc;
      border-radius: 20px;
      border: 3px solid #e2e8f0;
      padding: 8px;
      overflow: hidden;
    }

    .quiz-options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    .quiz-option-btn {
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .quiz-option-btn:hover {
      border-color: var(--accent-blue);
      background: #f0f9ff;
    }

    .quiz-option-btn.correct {
      border-color: var(--correct-green) !important;
      background: #dcfce7 !important;
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .quiz-option-btn.wrong {
      border-color: var(--wrong-red) !important;
      background: #fee2e2 !important;
      animation: shake 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .opt-suku-line {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .opt-full-line {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .opt-speaker {
      background: var(--accent-yellow);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 4px;
      box-shadow: 0 2px 0 #d97706;
    }

    .feedback-banner {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 12px;
      padding: 6px 16px;
      text-align: center;
      width: 100%;
    }

    .feedback-banner.success { background: #dcfce7; color: #15803d; }
    .feedback-banner.error { background: #fee2e2; color: #b91c1c; }

    /* Module 3: Card Flip Matching */
    .m3-header-status {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 10px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 15px;
      font-weight: bold;
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .m3-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 600px;
      perspective: 1000px;
    }

    @media (max-width: 480px) {
      .m3-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
    }

    .flip-card {
      background-color: transparent;
      aspect-ratio: 1 / 1.1;
      cursor: pointer;
      perspective: 1000px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border: 3px solid #ffffff;
      overflow: hidden;
    }

    .flip-card-front {
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      color: white;
      font-size: 2rem;
      font-weight: bold;
    }

    .flip-card-front::after {
      content: "❓";
      font-size: 1.8rem;
    }

    .flip-card-back {
      background: white;
      transform: rotateY(180deg);
      border: 3px solid var(--accent-blue);
    }

    .flip-card.matched .flip-card-back {
      border-color: var(--correct-green);
      background: #f0fdf4;
    }

    .card-content-img {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-content-word {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .card-suku-line {
      font-size: 1.2rem;
      font-weight: bold;
      line-height: 1.1;
    }

    .card-full-line {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-main);
    }

    /* Module 4: Records */
    .records-card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .record-item {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .record-info-title {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--text-main);
    }

    .record-info-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .record-badge {
      font-weight: bold;
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-overlay.active {
      display: flex;
    }

    .cert-modal-box {
      background: white;
      border-radius: 28px;
      padding: 20px;
      width: 100%;
      max-width: 750px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-height: 95vh;
      overflow-y: auto;
    }

    .cert-canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      background: #fff;
    }

    canvas#cert-canvas {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
    }

    .cert-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .review-list {
      width: 100%;
      max-height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .review-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff5f5;
      padding: 10px 15px;
      border-radius: 16px;
      border: 2px solid #fecaca;
    }

    .review-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      .app-title-ms { font-size: 2.4rem; }
      .app-title-zh { font-size: 1.3rem; }
      .word-suku-line { font-size: 2.5rem; }
      .word-full-line { font-size: 1.8rem; }
      .m1-image-box { width: 170px; height: 170px; }
      .quiz-img-box { width: 150px; height: 150px; }
      .quiz-options-grid { grid-template-columns: 1fr; }
      .opt-suku-line { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- Toast Bar -->
  <div id="toast-msg">Maklumat</div>

  <div id="app-container">
    
    <!-- Header -->
    <header id="global-header">
      <div class="student-badge">
        <span>👤</span>
        <span id="header-student-name">Tiada Nama / 未输入姓名</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-small" onclick="openNameModal()">✏️ Edit Nama / 修改姓名</button>
        <button class="btn-nav-home" id="btn-home-header" onclick="navToMenu()" style="display: none;">🏠 Menu Utama</button>
      </div>
    </header>

    <!-- VIEW 0: START MENU -->
    <section id="view-start-menu" class="view-screen active">
      <div class="menu-header">
        <h1 class="app-title-ms">Pekerjaan</h1>
        <h2 class="app-title-zh">职业名称</h2>
        <div class="app-subtitle">
          Lihat gambar, kenali perkataan dan membaca suku kata!<br>
          <small>看图认字，按 suku kata 拼读学习！</small>
        </div>
      </div>
